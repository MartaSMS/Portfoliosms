       .boton-menu {
      position: absolute;
      top: -15%;
      left: -5%;

      z-index: 15;

      cursor: pointer;
      pointer-events: auto;
    }

    .boton-menu-img {
      width: 5cqw;
      height: auto;
      display: block;

      filter: none;
      transition: filter 0.4s ease;
    }

    .boton-menu:hover .boton-menu-img {
      filter:
        drop-shadow(0 0 8px rgba(255, 180, 220, 0.6))
        drop-shadow(0 0 25px rgba(255, 180, 220, 0.4));
    }
  </style>
