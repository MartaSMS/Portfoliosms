<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Portfolio Marta</title>
  <link rel="icon" type="png" href="assets/logomarta.png">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Borel&display=swap"
    rel="stylesheet"
  >


  <link rel="stylesheet" href="style.css">
</head>


<body>

  <div class="scene">


    <img
      src="assets/fondoportfolio.jpeg"
      class="background"
      alt=""
    >



    <div class="elementos">



      <a
        href="diseno-grafico.html"
        class="Button-Diseno"
      >
      
        <span class="button-text">
          Diseño Gráfico
        </span>

        <img
          src="assets/libro.png"
          alt="Diseño Gráfico"
        >

      </a>


      <a
        href="ui-ux.html"
        class="button-web"
      >

        <span class="texto-web">
          Diseño Web / UI / UX
        </span>

        <img
          src="assets/pantalla.png"
          alt="Diseño Web / UI / UX"
        >

      </a>



      <a
        href="contacto.html"
        class="button-contacto"
        target="_blank"
      >

        <img
          src="assets/sobre.png"
          alt="Contacto"
        >

        <span class="texto-contacto">
          Contacto
        </span>

      </a>


    
      <a
        href="sobre-mi.html"
        class="button-sobre-mi"
        target="_blank"
      >

        <img
          src="assets/diario.png"
          alt="Sobre mí"
        >

        <span>
          Sobre mí
        </span>

      </a>


    </div>

  </div>
